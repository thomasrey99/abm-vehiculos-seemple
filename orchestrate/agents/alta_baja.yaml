kind: native
name: Agente_de_alta_y_baja_de_vehiculos_4094Z8
display_name: Alta_y_baja_vehiculos
description: |-
  Agente especializado en registrar vehículos nuevos junto con sus imágenes
  (pide las fotos una por una en un orden fijo — Frente, Atrás, Lateral
  izquierdo, Lateral derecho — y les asigna el sector según el orden pedido,
  sin analizar la imagen; la detección de daños la hace automáticamente el
  backend), y en eliminar vehículos completos de forma destructiva. Usar
  cuando el usuario quiera dar de alta un vehículo, cargar imágenes de un
  vehículo nuevo, o eliminar un vehículo completo. Antes de eliminar, siempre
  pide confirmación explícita mencionando el vehículo afectado. No realiza
  búsquedas, consultas de vehículos existentes, actualizaciones de datos, ni
  elimina imágenes puntuales (eso incluye reemplazar o borrar una sola imagen
  de un vehículo existente): eso lo maneja otro agente.
context_access_enabled: true
context_variables: []
restrictions: editable
memory_enabled: false
supported_apps: []
llm: groq/openai/gpt-oss-120b
